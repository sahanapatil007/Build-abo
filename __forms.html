<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>buildabo enquiry form</title>
</head>
<body>
  <!-- Netlify detects this static form at deploy. Do not delete. -->
  <form name="enquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="enquiry" />
    <input name="bot-field" />
    <input name="name" />
    <input name="phone" />
    <input name="email" />
    <input name="interest" />
    <input name="budget" />
    <input name="location" />
    <textarea name="message"></textarea>
    <input name="subject" />
  </form>
</body>
</html>
